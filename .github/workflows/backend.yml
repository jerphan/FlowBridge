name: Backend checks

on:
  push:
    branches: [main, codex/finalize-module-integration]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: FlowBridgeFrontend/package-lock.json
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.28"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: npm ci --ignore-scripts
        working-directory: FlowBridgeFrontend
      - run: npm test
        working-directory: FlowBridgeFrontend
      - run: npm run build
        working-directory: FlowBridgeFrontend
      - run: npx playwright install --with-deps chromium
        working-directory: FlowBridgeFrontend
      - run: npm run test:browser
        working-directory: FlowBridgeFrontend
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: browser-test-results
          path: FlowBridgeFrontend/test-results
  modules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.28"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run python scripts/check_modules.py
      - name: Check integration files
        run: uv run ruff check CodeManager.py FlowBridgeBackend flowbridge scripts tests
      - run: uv build
      - name: Verify installed wheel
        shell: bash
        run: |
          uv venv "$RUNNER_TEMP/flowbridge-wheel"
          uv pip install --python "$RUNNER_TEMP/flowbridge-wheel/bin/python" dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/flowbridge-wheel/bin/python" - <<'PY'
          import io
          from FlowBridgeBackend import CodeManager, FlowBridgePipeline
          from FlowBridgeBackend.source_mapping import SourceMappingLayer
          from flowbridge import CodeManager as LegacyManager
          assert LegacyManager is CodeManager
          manager = CodeManager()
          manager.loadFile(io.BytesIO(b"def f():\n    return 1\ntotal: int = 0\ntotal += f()\n"), fileName="main.py")
          result = FlowBridgePipeline(manager).analyze_current()
          assert result["status"] == "success"
          assert result["flowchart"]["graphs"]
          assert result["mapping"]["sourceMappings"]
          assert any(graph["graphType"] == "module" for graph in result["flowchart"]["graphs"].values())
          mappings = SourceMappingLayer()
          mappings.loadMappingOutput(result["mapping"])
          for entry in result["mapping"]["sourceMappings"]:
              assert mappings.getSourceLocation(entry["graphId"], entry["nodeId"]).fileId == manager.getProject().files[0].fileID
          PY

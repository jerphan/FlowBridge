<!DOCTYPE html>
<html lang="en">
  <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>FlowBridge</title>
        <link rel="stylesheet" href="./src/App.css">
  </head>
  <body>
    <div id="root">
      <header class="heading">
            <div class="headingLeft">
                <img src="./FlowBridgeIcon.png" alt="Logo Icon" class="logoIcon">
                <span class="brandName">FlowBridge</span>
            </div>
            <div class="headingCenter">
                <button class="startButton">
                    <img src="./StartButton.png" alt="Start Button">
                </button>
            </div>
            <div class="headingRight">
                <div class="user-profile">
                    <div>
                        <label for="loginButton">
                            <img src="./ProfilePicture.png" alt="Profile Icon" class="loginIcon">
                        </label>
                        <input type="button" id=loginButton class="toolButton">
                    </div>
                </div>
            </div>
      </header>
    </div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
